# ============================================================
#  MEDEQUIP Backend — Application Properties (Production-Ready)
# ============================================================

# ──────────────────────────────────────────────────────────
#  Server
# ──────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/

# ──────────────────────────────────────────────────────────
#  DataSource — MySQL (Environment Variables with Local Fallback)
# ──────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medequip_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Shashwat@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}

# ──────────────────────────────────────────────────────────
#  JPA / Hibernate
# ──────────────────────────────────────────────────────────
# In production, set DDL_AUTO=validate or DDL_AUTO=none
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ──────────────────────────────────────────────────────────
#  JWT Configuration
# ──────────────────────────────────────────────────────────
# IMPORTANT: Provide a 256-bit Base64 string via JWT_SECRET in production
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# 86400000 ms = 24 hours

# ──────────────────────────────────────────────────────────
#  Data Seeder
# ──────────────────────────────────────────────────────────
# Set to false in production to prevent seeding demo products and default admin
app.seed.enabled=${APP_SEED_ENABLED:true}

# ──────────────────────────────────────────────────────────
#  File Upload / Storage
# ──────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directory where uploaded images are stored
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.product-images-dir=${UPLOAD_PRODUCT_DIR:uploads/products}
app.upload.profile-images-dir=${UPLOAD_PROFILE_DIR:uploads/profiles}

# Base URL to serve static files (update to your production domain)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ──────────────────────────────────────────────────────────
#  CORS
# ──────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ──────────────────────────────────────────────────────────
#  Springdoc / Swagger (Disable in high-security production if required)
# ──────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=${SWAGGER_TRY_IT_OUT:true}

# ──────────────────────────────────────────────────────────
#  Logging
# ──────────────────────────────────────────────────────────
logging.level.com.medequip=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
