# ============================================================
#  MEDEQUIP Backend — Application Properties
# ============================================================

# ──────────────────────────────────────────────────────────
#  Server
# ──────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ──────────────────────────────────────────────────────────
#  DataSource — MySQL
# ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/medequip_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP defaults are fine)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ──────────────────────────────────────────────────────────
#  JPA / Hibernate
# ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ──────────────────────────────────────────────────────────
#  JWT
# ──────────────────────────────────────────────────────────
# IMPORTANT: Change this to a random 256-bit Base64 string in production
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
# 86400000 ms = 24 hours

# ──────────────────────────────────────────────────────────
#  File Upload / Local Storage
# ──────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directory where uploaded images are stored (relative to project root)
app.upload.dir=uploads
app.upload.product-images-dir=uploads/products
app.upload.profile-images-dir=uploads/profiles

# Base URL to serve static files (update to your server URL in production)
app.base-url=http://localhost:8080

# ──────────────────────────────────────────────────────────
#  CORS
# ──────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ──────────────────────────────────────────────────────────
#  Springdoc / Swagger
# ──────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ──────────────────────────────────────────────────────────
#  Logging
# ──────────────────────────────────────────────────────────
logging.level.com.medequip=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
