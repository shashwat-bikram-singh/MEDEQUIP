<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MyWebsite</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
   

    <div class="auth-container">
        <div class="auth-background register-bg">
            <div class="auth-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
            </div>
            <div class="auth-bg-content">
                <h2>Join Us Today!</h2>
                <p>Create an account to unlock all features and start your amazing journey.</p>
                <img src="https://illustrations.popsy.co/amber/designer.svg" alt="Register Illustration">
            </div>
        </div>
        
        <div class="auth-form-container">
            <a href="index.html" class="auth-logo">
                <i class="fas fa-code"></i>
                <span>MyWebsite</span>
            </a>
            
            <div class="auth-form-wrapper animate-slide-up">
                <h1>Create Account</h1>
                <p class="auth-subtitle">Fill in your details to get started</p>
                
                <!-- Progress Steps -->
                <div class="progress-steps" id="progressSteps">
                    <div class="progress-line">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="step active" data-step="1">
                        <div class="step-circle">1</div>
                        <span>Personal Info</span>
                    </div>
                    <div class="step" data-step="2">
                        <div class="step-circle">2</div>
                        <span>Account</span>
                    </div>
                    <div class="step" data-step="3">
                        <div class="step-circle">3</div>
                        <span>Complete</span>
                    </div>
                </div>
                
                <form class="auth-form" id="registerForm">
                    <!-- Step 1: Personal Info -->
                    <div class="form-step active" data-step="1">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First Name</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-user"></i>
                                    <input type="text" id="firstName" name="firstName" placeholder="John" required>
                                </div>
                                <span class="error-message" id="firstNameError"></span>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last Name</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-user"></i>
                                    <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
                                </div>
                                <span class="error-message" id="lastNameError"></span>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <div class="input-wrapper">
                                <i class="fas fa-phone"></i>
                                <input type="tel" id="phone" name="phone" placeholder="+1 234 567 8900">
                            </div>
                            <span class="error-message" id="phoneError"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="dob">Date of Birth</label>
                            <div class="input-wrapper">
                                <i class="fas fa-calendar"></i>
                                <input type="date" id="dob" name="dob">
                            </div>
                        </div>
                        
                        <button type="button" class="btn btn-primary btn-block" id="nextStep1">
                            Continue <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                    
                    <!-- Step 2: Account Details -->
                    <div class="form-step" data-step="2">
                        <div class="form-group">
                            <label for="regEmail">Email Address</label>
                            <div class="input-wrapper">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="regEmail" name="email" placeholder="john@example.com" required>
                            </div>
                            <span class="error-message" id="regEmailError"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="username">Username</label>
                            <div class="input-wrapper">
                                <i class="fas fa-at"></i>
                                <input type="text" id="username" name="username" placeholder="johndoe" required>
                            </div>
                            <span class="error-message" id="usernameError"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="regPassword">Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="regPassword" name="password" placeholder="Create a strong password" required>
                                <button type="button" class="toggle-password" id="toggleRegPassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="password-strength" id="passwordStrength">
                                <div class="strength-bar"></div>
                                <span class="strength-text">Password strength</span>
                            </div>
                            <span class="error-message" id="regPasswordError"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                            </div>
                            <span class="error-message" id="confirmPasswordError"></span>
                        </div>
                        
                        <div class="form-buttons">
                            <button type="button" class="btn btn-outline" id="prevStep2">
                                <i class="fas fa-arrow-left"></i> Back
                            </button>
                            <button type="button" class="btn btn-primary" id="nextStep2">
                                Continue <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Step 3: Confirmation -->
                    <div class="form-step" data-step="3">
                        <div class="form-group">
                            <label class="checkbox-wrapper">
                                <input type="checkbox" id="terms" name="terms" required>
                                <span class="checkmark"></span>
                                I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                            </label>
                        </div>
                        
                        <div class="form-group">
                            <label class="checkbox-wrapper">
                                <input type="checkbox" id="newsletter" name="newsletter">
                                <span class="checkmark"></span>
                                Subscribe to our newsletter for updates
                            </label>
                        </div>
                        
                        <div class="form-buttons">
                            <button type="button" class="btn btn-outline" id="prevStep3">
                                <i class="fas fa-arrow-left"></i> Back
                            </button>
                            <button type="submit" class="btn btn-primary" id="registerSubmit">
                                Create Account <i class="fas fa-check"></i>
                            </button>
                        </div>
                    </div>
                </form>
                
                <div class="auth-divider">
                    <span>or sign up with</span>
                </div>
                
                <div class="social-auth">
                    <button class="social-btn google" id="googleRegister">
                        <i class="fab fa-google"></i>
                        Google
                    </button>
                    <button class="social-btn facebook" id="facebookRegister">
                        <i class="fab fa-facebook-f"></i>
                        Facebook
                    </button>
                </div>
                
                <p class="auth-redirect">
                    Already have an account? <a href="login.html">Sign in</a>
                </p>
            </div>
            
            <a href="index.html" class="back-home">
                <i class="fas fa-arrow-left"></i>
                Back to Home
            </a>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
